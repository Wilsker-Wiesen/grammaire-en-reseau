<title>Grammaire en réseau</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Règles de grammaire française, exercices et jeux reliés en réseau. Un programme de Jan Wilsker-Wiesen.">

      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="Accueil">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle cx="8" cy="9" r="3.2"/><circle cx="23" cy="7" r="2.4"/><circle cx="17" cy="20" r="4"/><circle cx="6" cy="24" r="2"/><circle cx="27" cy="22" r="2.6"/><path d="M8 9 17 20M23 7 17 20M6 24 17 20M27 22 17 20M8 9 23 7"/></svg>

      <span class="brand-text"><strong>Grammaire</strong><span>en réseau</span></span>
    </a>
    <button class="search-trigger" id="search-trigger" aria-label="Rechercher (Ctrl+K)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <span>Rechercher une règle, un mot, un exercice…</span>
      <kbd>Ctrl K</kbd>
    </button>
    <div class="topbar-actions">
      <button class="icon-btn" id="back-btn" aria-label="Retour" title="Retour (Alt ←)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="icon-btn" id="theme-btn" aria-label="Changer de thème" title="Thème clair / sombre">

    <div class="nav-foot" id="nav-foot"></div>

  <main class="main" id="main" tabindex="-1">
    <div class="boot" id="boot">
      <div class="boot-mark"></div>
      <p>Chargement du programme…</p>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Fiche ouverte à côté" hidden></aside>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Recherche" hidden>
  <div class="palette-box">
    <div class="palette-input">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="palette-q" type="search" placeholder="subjonctif, accord du participe, quoique…" autocomplete="off" spellcheck="false">
      <kbd>Échap</kbd>
    </div>
    <div class="palette-results" id="palette-results"></div>
  </div>
</div>
<div class="accent-bar" id="accent-bar" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="peek" id="peek" hidden></div>
